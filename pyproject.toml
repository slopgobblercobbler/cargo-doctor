[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cargo-doctor"
version = "0.1.0"
description = "Production-grade linter, duplicate detector, and autofixer for Rust Cargo.toml and workspace manifests."
readme = "README.md"
authors = [
    { name = "slopggobblercobbler81", email = "slopggobblercobbler81@users.noreply.github.com" }
]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Quality Assurance",
]
keywords = ["cargo", "rust", "linter", "cargo-toml", "workspace", "dependency-checker", "autofix"]
requires-python = ">=3.8"
dependencies = [
    "tomli>=1.1.0; python_version < '3.11'",
    "rich>=12.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.scripts]
cargo-doctor = "cargo_doctor.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cargo_doctor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
